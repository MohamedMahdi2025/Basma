<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:radial-gradient(60% 90% at 78% 40%,#2F5D8C 0%,#142236 62%,#0B1420 100%);color:#fff;font-family:'IBM Plex Sans Arabic',sans-serif;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(70% 90% at 75% 45%,#000,transparent)}
.mark{position:absolute;right:120px;top:70px;width:360px;height:360px}
.mark img{position:absolute;inset:70px;width:220px;height:220px;border-radius:50%;box-shadow:0 0 60px rgba(95,184,255,.45)}
.mark svg{position:absolute;inset:0}
.txt{position:absolute;left:70px;top:120px;width:470px;text-align:right}
h1{margin:0;font-size:84px;line-height:1;font-weight:700}
.en{font-family:Manrope;font-weight:800;letter-spacing:.35em;font-size:22px;opacity:.75;margin-top:14px}
p{font-size:28px;line-height:1.5;margin:26px 0 0;color:#DCE6F2}
</style></head><body><div class="grid"></div>
<div class="mark"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="95" fill="none" stroke="rgba(127,216,255,.2)" stroke-width="2.4"/><circle cx="100" cy="100" r="95" fill="none" stroke="#7FE7FF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="190 600" transform="rotate(-90 100 100)"/><circle cx="182" cy="52" r="4.5" fill="#BFF4FF"/></svg><img src="icon-512.png"></div>
<div class="txt"><h1>بصمة</h1><div class="en">BASMA</div><p>الحضور والموارد البشرية<br>بلمسة واحدة، محمي برمزك السري</p></div>
</body></html>
